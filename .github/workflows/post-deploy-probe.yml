name: Post-deploy probe

# Scheduled verification for the deployed Worker (TOG-8365, gap G18).
# Runs the public liveness probe plus the authed probes when operator
# credentials are present; without them the authed probes SKIP (exit 0)
# instead of paging. Any probe that actually runs and fails turns the job
# red — that is the alert. Read-only GETs against /api/v1/*; no writes.
on:
  schedule:
    # 07:30 UTC daily — after the 07:00 data-snapshot cron settles (wrangler.toml).
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Schedule/dispatch-only workflow (TOG-23109): keep each execution isolated
  # so a newer pending probe cannot replace an earlier alert-path run.
  group: post-deploy-probe-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  probe:
    name: Probe deployed Worker (skip-safe)
    runs-on: ubuntu-latest
    # TOG-19017: bound so a hung probe against a down Worker pages via red,
    # not via a forever-running job.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run skip-safe probe
        # --skip-if-no-token: no bearer configured yet, so the authed probes
        # log SKIP and exit 0; the public probe still runs and failures fail
        # the job. SHADOW_API_BASE and SHADOW_API_TOKEN come from the
        # environment when the operator configures an approved staging target.
        # --scheduled rejects missing/invalid/local targets before any fetch;
        # a configuration error keeps the job red, never silently skips it.
        # See docs/SCHEDULED-PROBE.md. Never substitute production.
        run: npm run probe:post-deploy:scheduled
        env:
          SHADOW_API_BASE: ${{ vars.SHADOW_API_BASE }}
          SHADOW_API_TOKEN: ${{ secrets.SHADOW_API_TOKEN }}
