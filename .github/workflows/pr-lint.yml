name: PR lint

# Org convention for every change that lands on main (TogetherWeOwn GitHub standard):
#   * PR title = Conventional Commits header: `type(scope): summary`, <= 100 chars, no trailing period.
#     Types: feat fix perf refactor test docs build ci chore revert style security.
#     Put the issue ref in the body (`Refs: #123`), not in the title.
#   * PR body explains what changed, why, and how it was tested.
#   * Repos are squash-merge only and the squash commit title is the PR title, so the history on
#     main is one conventional commit per PR. The push job below flags any commit that bypasses it
#     (for example a merge call that passes its own commit_title).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Per-PR group (PR #265): PR number for pull_request events, so a new
  # push cancels that PR's superseded runs. Non-PR runs (push-to-main) each
  # get their own group via sha, so a queued lint run is never replaced and
  # every push's commits are linted. Cancel only on pull_request.
  group: pr-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REQUIRE_CARD_REF: "true"
  PR_STANDARDS_MODE: "warn"

jobs:
  pr-lint:
    name: pr-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
      - name: Unit-test the lint
        run: python3 -m unittest discover -s .github/scripts -p 'test_pr_standards.py'
      - name: Check title, body, branch and commits
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: python3 .github/scripts/pr_standards.py
