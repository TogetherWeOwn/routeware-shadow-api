name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, build
    runs-on: [self-hosted, two-selfhosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test (with coverage ratchet)
        # Thresholds in vitest.config.ts are pinned just under current coverage so
        # it can never regress. Raise them as coverage climbs toward the ECC 80%.
        run: npm run test:coverage
      - name: Coverage ratchet — raise floors when the number goes up
        # Vitest thresholds fail the run on REGRESSION; this step fails when a
        # metric climbs a full point above its floor without raising it, and
        # prints the suggested thresholds block (TOG-6289).
        run: npm run check:coverage-ratchet
      - name: Validate CI workflow invariants
        run: npm run check:ci-workflow
      - name: Validate Worker build (no deploy)
        # Bundles the Worker and validates wrangler.toml bindings. --dry-run does
        # not call the Cloudflare API, so no account or token is needed.
        run: npx wrangler deploy --dry-run

  shadow-api-v1:
    name: shadow-api-v1
    runs-on: [self-hosted, two-selfhosted]
    # Skipped-check allowlist: the staging probe stays visible while operator
    # credentials are gated. The gate emits the reason and links TODO TOG-135.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Evaluate operator credential gate
        id: credential-gate
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
        run: npm run check:shadow-api-v1
      - name: Execute versioned API contract tests
        if: steps.credential-gate.outputs.status == 'ready'
        run: |
          npm ci
          npm run test:contracts

  hygiene:
    name: Repo hygiene & secret scan
    runs-on: [self-hosted, two-selfhosted]
    steps:
      - uses: actions/checkout@v4
      - name: No committed Routeware report exports (PII)
        run: |
          matches="$(git ls-files | grep -iE '\.csv$|:Zone\.Identifier$' || true)"
          if [ -n "$matches" ]; then
            echo "::error::Tracked CSV / Zone.Identifier files found — Routeware exports contain PII and must not be committed:"
            echo "$matches"
            exit 1
          fi
      - name: No committed .dev.vars
        run: |
          matches="$(git ls-files | grep -E '(^|/)\.dev\.vars$' || true)"
          if [ -n "$matches" ]; then
            echo "::error::A .dev.vars file is tracked — local secrets must stay untracked (only .dev.vars.example is allowed):"
            echo "$matches"
            exit 1
          fi
      - name: D1 migration drift check (TOG-6275)
        # Credential-free: manifest sha256 compare + fresh local apply into a
        # scratch persist dir, journal compared to the file list. Fails the
        # build on edited/missing/extra migrations. The read-only remote
        # compare runs only with --remote plus an ambient token (deploy-time
        # concern, never a hygiene secret).
        run: npm run check:d1-drift
      - name: Secret scan (informational)
        # Non-blocking: scans the working tree only (--no-git), so it won't trip on
        # secrets still present in git history. Promote to blocking once it's green.
        continue-on-error: true
        run: |
          version=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-git --redact --config .gitleaks.toml

  deploy:
    name: Deploy to Cloudflare Workers
    # Fail closed unless production deploys have been explicitly enabled. Build and
    # hygiene remain credential-free while this repository variable is absent.
    needs: [build, hygiene]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, two-selfhosted]
    # Scopes the CLOUDFLARE_API_TOKEN secret; add required reviewers here to gate prod.
    environment: production
    # Serialize deploys so overlapping merges can't race; don't cancel an in-flight one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: R2 bucket preflight (TOG-6290)
        # Read-only `wrangler r2 bucket info <name> --json` lookup: the SNAPSHOTS
        # bucket must exist before deploy, else snapshot CSV archiving silently
        # drops. Fails closed naming the fix (`wrangler r2 bucket create`); skips
        # cleanly when SNAPSHOTS_R2_ENABLED=false (D1-only archiving by design).
        run: node scripts/check-r2-preflight.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Apply D1 migrations (remote)
        # Runs before deploy so the schema is present before the new code goes live.
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker
        # Uses the repo's pinned Wrangler. Worker secrets (SHADOW_API_TOKEN, etc.) are
        # set once via `wrangler secret put` and are not touched by deploy. account_id
        # lives in wrangler.toml, so only the API token is needed here.
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
