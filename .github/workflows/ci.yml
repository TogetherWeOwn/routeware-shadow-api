name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly full suite (TOG-14877 rule 5): push-to-main plus schedule run
    # EVERYTHING, so a regression that slips past PR gating is caught within hours.
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    # CI standard (TOG-14877 rules 1-2, TOG-14898): native git diff vs merge
    # base, no third-party action. Outputs one boolean per area; heavy jobs
    # gate on these with job-level `if:` (never workflow-level `paths:`, which
    # would leave required checks unreported). Full suite on push-to-main,
    # nightly schedule, or when infra/filter/deps change (rule 4).
    runs-on: [self-hosted, two-selfhosted]
    # TOG-19017: every job carries a bound so a hung runner can never stall
    # the PR forever (previously only pr-lint set timeout-minutes).
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
      probe: ${{ steps.filter.outputs.probe }}
      infra: ${{ steps.filter.outputs.infra }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: merge-base diff needs the base commit present. A
          # shallow checkout would silently compute an empty diff.
          fetch-depth: 0
      - id: filter
        run: |
          # Non-PR events (push-to-main, nightly schedule): run EVERYTHING.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Non-PR event (${{ github.event_name }}): full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "probe=true" >> "$GITHUB_OUTPUT"
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          if [ -z "$base" ]; then
            echo "::warning::merge base not found — running full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "probe=true" >> "$GITHUB_OUTPUT"
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: with rename detection `git mv src/x.ts docs/x.ts`
          # lists only the new path, so the deleted code file would look
          # docs-only. A rename is a delete plus an add; both sides must show.
          files="$(git diff --name-only --no-renames "$base"...HEAD)"
          echo "Changed files:"
          echo "$files"
          # code: gates `build` (src, tests, manifests, build config, migrations).
          if echo "$files" | grep -qE '^(src/|test/|migrations/|tools/api-discovery/|package\.json$|package-lock\.json$|tsconfig\.json$|tsconfig\.src\.json$|vitest\.config\.ts$|wrangler\.toml$|worker-configuration\.d\.ts$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # probe: gates `shadow-api-v1` (contract probe inputs only).
          if echo "$files" | grep -qE '^(test/shadow|scripts/check-shadow-api-v1\.mjs$)'; then
            echo "probe=true" >> "$GITHUB_OUTPUT"
          else
            echo "probe=false" >> "$GITHUB_OUTPUT"
          fi
          # infra: the filter itself, workflow config, the .nvmrc Node pin,
          # shared entry, discovery manifests. Any infra change means
          # EVERYTHING runs (rule 4).
          if echo "$files" | grep -qE '^(\.github/|\.nvmrc$|scripts/check-ci-workflow\.mjs$|scripts/lib/ciWorkflowCheck\.mjs$|src/worker\.ts$|tools/api-discovery/package.*\.json$)'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi
          # full: root dep manifests also run EVERYTHING (rule 4), so a
          # package.json/lock bump runs build AND probe (verified TOG-14898).
          # Non-PR already exited above; on PRs full = infra OR root dep change.
          if echo "$files" | grep -qE '^(package\.json$|package-lock\.json$|\.github/|\.nvmrc$|scripts/check-ci-workflow\.mjs$|scripts/lib/ciWorkflowCheck\.mjs$|src/worker\.ts$|tools/api-discovery/package.*\.json$)'; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Typecheck, test, build
    needs: [changes]
    # CI standard gating (TOG-14877): heavy job runs only when its area
    # changed. docs-only PRs skip this; push/main + nightly run it via full.
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.full == 'true'
    runs-on: [self-hosted, two-selfhosted]
    # TOG-19017: bound the full typecheck + coverage suite (heaviest CI job).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Regenerate Worker types (TOG-8373)
        # worker-configuration.d.ts is gitignored (generated by `wrangler
        # types`, bakes wrangler.toml [vars] into literal string types).
        # `wrangler types` is deterministic (byte-identical regen) and
        # offline-safe, so generating here keeps typecheck/build hermetic.
        run: npm run types
      - name: Typecheck
        run: npm run typecheck
      - name: Console lint
        run: npm run lint
      - name: Test (with coverage ratchet)
        # Thresholds in vitest.config.ts are pinned just under current coverage so
        # it can never regress. Raise them as coverage climbs toward the ECC 80%.
        run: npm run test:coverage
      - name: Validate CI workflow invariants
        run: npm run check:ci-workflow
      - name: Validate R2 preflight against deployed config (offline)
        run: node scripts/check-r2-deploy-config.mjs
      - name: Validate Worker build (no deploy)
        # Bundles the Worker and validates wrangler.toml bindings. --dry-run does
        # not call the Cloudflare API, so no account or token is needed.
        run: npx wrangler deploy --dry-run

  shadow-api-v1:
    name: shadow-api-v1
    needs: [changes]
    # CI standard gating (TOG-14877): probe inputs only. Keeps the existing
    # credential fail-closed step gate below; this job-level gate only decides
    # whether the job runs at all. NOT a required check (hybrid, per TOG-14898).
    if: needs.changes.outputs.probe == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.full == 'true'
    runs-on: [self-hosted, two-selfhosted]
    # TOG-19017: bound so a hung contract run can never stall the PR.
    timeout-minutes: 15
    # Skipped-check allowlist: the staging probe stays visible while operator
    # credentials are gated. The gate emits the reason and links TODO TOG-135.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Evaluate operator credential gate
        id: credential-gate
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
        run: npm run check:shadow-api-v1
      - name: Execute versioned API contract tests
        if: steps.credential-gate.outputs.status == 'ready'
        run: |
          npm ci
          npm run test:contracts

  hygiene:
    name: Repo hygiene & secret scan
    # Always-run by design (TOG-6539 + TOG-14877 rule 6): the PII gate
    # (CSV/.dev.vars) and the blocking secret scan must run on EVERY pull
    # request, including docs-only ones. No `if:`/`needs:` here — gating this
    # job would let PII or a secret land while `ci-ok` stays green. LIGHT
    # (~1 min credential-free checks), so always running it costs nothing.
    runs-on: [self-hosted, two-selfhosted]
    # TOG-19017: bound (gitleaks download + drift gates must fail fast, not hang).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the blocking secret scan below covers git history, not
          # just the working tree. A shallow checkout would silently scan one commit.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Hermetic post-deploy probe regressions
        # Always run even for probe-only PRs whose filtered build is skipped.
        run: npm run test:probe
      - name: Regenerate Worker types (TOG-8373)
        # worker-configuration.d.ts is gitignored — regenerate it here so the
        # baked-secrets gate below inspects current wrangler.toml [vars].
        run: npm run types
      - name: No committed Routeware report exports (PII)
        run: |
          matches="$(git ls-files | grep -iE '\.csv$|:Zone\.Identifier$' || true)"
          if [ -n "$matches" ]; then
            echo "::error::Tracked CSV / Zone.Identifier files found — Routeware exports contain PII and must not be committed:"
            echo "$matches"
            exit 1
          fi
      - name: No committed .dev.vars
        run: |
          matches="$(git ls-files | grep -E '(^|/)\.dev\.vars$' || true)"
          if [ -n "$matches" ]; then
            echo "::error::A .dev.vars file is tracked — local secrets must stay untracked (only .dev.vars.example is allowed):"
            echo "$matches"
            exit 1
          fi
      - name: No real secrets baked into worker-configuration.d.ts
        run: |
          # `wrangler types` bakes wrangler.toml [vars] values into this generated
          # (gitignored, TOG-8373) file as literal string types. Only the
          # synthetic test literals below may appear for these keys; any other value
          # fails the job. Fails closed when the file is absent (a skipped regen
          # must never pass). Gitleaks also scans this file (it is not allowlisted).
          if [ ! -f worker-configuration.d.ts ]; then
            echo "::error::worker-configuration.d.ts missing — the 'Regenerate Worker types' step must run before this gate."
            exit 1
          fi
          allow='test-sync-secret|test-api-token|test-user|test-password-not-real'
          matches="$(grep -nE '^[[:space:]]*(CUSTOMER_SNAPSHOT_SYNC_SECRET|SHADOW_API_TOKEN|LOGIN_USERNAME|LOGIN_PASSWORD)\??:' worker-configuration.d.ts | grep -vE "\"(${allow})\"" || true)"
          if [ -n "$matches" ]; then
            echo "::error::worker-configuration.d.ts carries non-synthetic values — real values belong in .dev.vars / wrangler secret, never in wrangler.toml [vars]:"
            echo "$matches"
            exit 1
          fi
      - name: D1 migration drift check (TOG-6275)
        # Credential-free: manifest sha256 compare + fresh local apply into a
        # scratch persist dir, journal compared to the file list. Fails the
        # build on edited/missing/extra migrations. The read-only remote
        # compare runs only with --remote plus an ambient token (deploy-time
        # concern, never a hygiene secret).
        run: npm run check:d1-drift
      - name: OpenAPI drift check (TOG-6282)
        # Credential-free: static compare of declared createRoute() ops vs the
        # ops published via .openapi() in each mounted route module. Fails the
        # build on any dropped op (e.g. plain-Hono regression).
        run: npm run check:openapi-drift
      - name: Source file size guard (TOG-6291)
        # Credential-free: counts lines in hand-written src/ files, fails on any
        # file over 800 lines. No network access and no credential use.
        run: npm run check:source-file-size
      - name: R2 lifecycle proposal shape guard (TOG-25213)
        # Credential-free: validates docs/r2-lifecycle-proposal.snapshot-history.json
        # stays a byte-clean S3 PutBucketLifecycleConfiguration body (exact rule
        # id, Filter.Prefix, and Expiration; Status: Enabled intent; no
        # Transitions or extra keys). Fails the build on drift so it surfaces
        # here, not at apply time against a live bucket.
        run: npm run check:r2-lifecycle-proposal
      - name: Vars parity check (TOG-8367)
        # Credential-free: compares wrangler.toml [vars] keys against
        # .dev.vars.example mentions (active or commented `# KEY=`), failing
        # on divergence in either direction. Keys only, never values.
        run: npm run check:vars-parity
      - name: Changelog gate (TOG-8385)
        # Credential-free: diffs the PR against origin/main and fails when a
        # consumer-visible contract path (routes, response shapes, wrangler
        # routes/vars, D1 schema) changed without a TOG-1234 bullet under
        # CHANGELOG.md ## [Unreleased]. Docs/test/scripts/CI-only changes
        # skip the gate.
        run: npm run check:changelog
      - name: Prod dependency audit (TOG-8904)
        # Credential-free: `npm audit --omit=dev` against the public registry;
        # fails on unallowlisted high/critical advisories. The allowlist (with
        # reasons + remediation paths) lives in scripts/lib/depsAuditCheck.mjs;
        # stale entries fail the gate so Dependabot fixes clean up after
        # themselves. Process: docs/DEPENDENCY-AUDIT.md.
        run: npm run check:deps-audit
      - name: Secret scan (blocking)
        # Blocking: scans the full git history (fetch-depth: 0 above). History is
        # clean (HANDOVER.md section 5: no refs/pull/*, 0 CSV blobs, 0 secret hits),
        # so any finding fails the job.
        run: |
          version=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --config .gitleaks.toml

  ci-ok:
    name: ci-ok
    # CI standard aggregator (TOG-14877 rule 3): the ONE required check.
    # `if: always()` so gating can never leave the PR hanging; passes when
    # every needed job succeeded or was skipped. Branch protection requires
    # only this (+ pr-lint, secret scan via hygiene). Deploy is EXEMPT
    # (own push-only trigger) and is intentionally not in `needs:`.
    if: always()
    needs: [changes, build, shadow-api-v1, hygiene]
    runs-on: [self-hosted, two-selfhosted]
    # TOG-19017: bound like every other job (trivial aggregation, small cap).
    timeout-minutes: 5
    steps:
      - name: Verify required jobs passed or were skipped
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "Job results (changes,build,shadow-api-v1,hygiene): $results"
          if echo "$results" | grep -qE 'failure|cancelled'; then
            echo "::error::Required jobs failed or were cancelled: $results"
            exit 1
          fi
          echo "ci-ok: all required jobs passed or were skipped."

  deploy:
    name: Deploy to Cloudflare Workers
    # Fail closed unless production deploys have been explicitly enabled. Build and
    # hygiene remain credential-free while this repository variable is absent.
    needs: [build, hygiene]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, two-selfhosted]
    # Scopes the CLOUDFLARE_API_TOKEN secret; add required reviewers here to gate prod.
    environment: production
    # Preflight and deploy read this same config; shell vars are not Worker vars.
    env:
      WRANGLER_CONFIG: wrangler.toml
    # Serialize deploys so overlapping merges can't race; don't cancel an in-flight one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # TOG-19017: bound so a stalled deploy (D1 migrate, wrangler push) fails
    # loudly instead of holding the production environment forever.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: R2 bucket preflight (TOG-6290)
        # Read-only `wrangler r2 bucket info <name> --json` lookup: the SNAPSHOTS
        # bucket must exist before deploy, else snapshot CSV archiving silently
        # drops. Fails closed naming the fix (`wrangler r2 bucket create`); skips
        # cleanly when the deployed config has SNAPSHOTS_R2_ENABLED="false".
        run: node scripts/check-r2-preflight.mjs --config="$WRANGLER_CONFIG"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Apply D1 migrations (remote)
        # Runs before deploy so the schema is present before the new code goes live.
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker
        # Uses the repo's pinned Wrangler. Worker secrets (SHADOW_API_TOKEN, etc.) are
        # set once via `wrangler secret put` and are not touched by deploy. account_id
        # lives in wrangler.toml, so only the API token is needed here.
        run: npx wrangler deploy --config "$WRANGLER_CONFIG"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
