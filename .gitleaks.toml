# gitleaks config for the blocking CI secret scan (full git history).
# Extends the default ruleset and allowlists intentional dev/test placeholders and
# fixtures so only NEW, real secrets are flagged.
[extend]
useDefault = true

[allowlist]
description = "Intentional non-secret placeholders and test fixtures"
paths = [
  '''tools/api-discovery/examples/.*''',
  '''test/.*''',
  '''\.dev\.vars\.example$''',
  '''docs/PROBLEMS\.md$''',
]
regexes = [
  '''dev-local-shadow-api-token-change-me''',
  '''dev-local-sync-secret-change-me''',
  '''test-api-token''',
  '''test-sync-secret''',
  '''test-password-not-real''',
  # `SNAPSHOTS_R2_ENABLED` is a "true"/"false" feature flag in wrangler.toml, not a
  # secret — the generic-api-key rule flags the identifier itself (TOG-5485).
  '''SNAPSHOTS_R2_ENABLED''',
  # curl-auth-header false positives (TOG-24449 public-first gate): docs show
  # shell-variable / dummy-literal Bearer examples, never real tokens. The
  # gitleaks global allowlist matches against the detected secret fragment
  # (the part after `Bearer `), so both the bare and prefixed forms are listed.
  # `$SYNC_OLD` / `$API_OLD` shell vars in docs/SECRET-ROTATION-RUNBOOK.md.
  '''Bearer \$[A-Z_]+''',
  '''\$SYNC_OLD''',
  '''\$API_OLD''',
  # `-H 'Authorization: Bearer local-recovery-sync'` in docs/R2-RESTORE-RUNBOOK.md.
  '''Bearer local-recovery-sync''',
  '''local-recovery-sync''',
  # `Bearer wrong-token` negative-probe example in docs/SECRET-ROTATION-RUNBOOK.md.
  '''Bearer wrong-token''',
  '''wrong-token''',
]
